[package]
name = "badger"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.6", features = ["json", "macros"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", features = ["mysql", "runtime-tokio-native-tls", "macros", "chrono"] }
dotenvy = "0.15"
thiserror = "2.0.17"
image = { version = "0.25.8", features = ["jpeg", "png", "tiff"]}
printpdf = { version = "0.8.2", features = ["jpeg", "png", "tiff"] }
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5.3"
jsonwebtoken = { version= "10.1.0", features = ["rust_crypto"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["cors", "fs"] }
mime = "0.3"
axum-extra = { version = "0.12.0", features = ["cookie", "multipart"] }
tracing = "0.1"
tracing-subscriber = "0.3"
sha1 = "0.10.6"
hex = "0.4.3"
bcrypt = "0.17.1"
thotp = "0.1.11"
chrono = "0.4.42"
askama = { version = "0.14.0", features = ["full"]}
strum = { version = "0.27", features = ["derive"] }
md5 = "0.8.0"
base16ct = { version = "0.3.0", features = ["alloc"] }
csscolorparser = "0.7.2"
